; PlatformIO project for InkWriter (Xteink X4/X3, ESP32-C3).
;
; Device layer from inkkit (pinned); BLE HID host vendored under
; lib/BleKeyboardHost (from the CrumBLE freeink-sdk fork, MIT) with
; NimBLE-Arduino from the registry. The editor/session core in src/core is
; Arduino-free and host-tested via test/host/run.sh.
;
; Note: run pio environments one at a time (pio run -e <env>); concurrent pio
; invocations race on the shared ~/.platformio package directory.

[platformio]
default_envs = xteink_x4

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv

lib_deps =
  ; Canonical inkkit pin: the complete device layer (HAL + vendored SDK).
  https://github.com/mohitagw15856/inkkit.git#v0.1.0-rc2
  ; BLE stack for the vendored BleKeyboardHost (see its library.json note).
  h2zero/NimBLE-Arduino@^2.3.8

build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -Isrc
  ; BLE HID host capability (BleKeyboardHost) with a minimal central-only
  ; NimBLE footprint; see lib/BleKeyboardHost and ARCHITECTURE.md.
  -DFREEINK_CAP_BLE_HID_HOST=1
  -DFREEINK_BLE_HID_SHOW_UNNAMED_DEVICES=0
  -DCONFIG_BT_NIMBLE_EXT_ADV=1
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=1
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=1
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=0
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=4

build_unflags =
  -std=gnu++11

[env:xteink_x4]
extends = base

[env:xteink_x3]
extends = base
; Identical firmware; runtime device detection. Two envs ship named .bins.
